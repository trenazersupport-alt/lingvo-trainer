<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingvo Trainer — Образовательная платформа</title>
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="stylesheet" href="theme.css?v=8" />
</head>
<body>
  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="lt-topbar">
    <div class="lt-topbar-left">
      <a href="#home" class="lt-brand" onclick="Router.go('home'); return false;">
        <img src="logo.png" alt="Lingvo Trainer" class="lt-brand-logo" onerror="this.style.display='none'" />
        <div class="lt-brand-text">
          <span class="lt-brand-title">Lingvo Trainer</span>
          <span class="lt-brand-sub">О проекте • Правила • Статистика</span>
        </div>
      </a>
    </div>

    <div class="lt-topbar-right">
      <button id="topAccountBtn" type="button" class="lt-account-btn" onclick="AuthUI.handleTopBtn(this)">
        <span id="topAccountStatusDot" class="lt-status-dot"></span>
        <span id="topAccountLabel">Аккаунт</span>
        <span id="topAccountArrow" class="lt-arrow-glyph" style="display:none;">▾</span>
      </button>
      <div class="lt-nav-arrows">
        <button id="btnNavBack" type="button" class="lt-icon-btn" title="Назад" onclick="Router.back()">«</button>
        <button id="btnNavForward" type="button" class="lt-icon-btn" title="Вперёд" onclick="Router.forward()">»</button>
      </div>
    </div>
  </header>

  <!-- ОСНОВНАЯ РАБОЧАЯ ОБЛАСТЬ -->
  <main id="appRoot" class="lt-main"></main>

  <!-- ФУТЕР -->
  <footer class="lt-footer">
    <span>© 2026 Lingvo Trainer • Образовательная платформа</span>
    <button type="button" class="lt-footer-support-btn" onclick="Router.go('support')">Написать в поддержку</button>
  </footer>

  <!-- МОДАЛЬНОЕ ОКНО: ВХОД / РЕГИСТРАЦИЯ / СБРОС ПАРОЛЯ -->
  <div id="authModal" class="lt-modal-overlay" style="display:none;">
    <div class="lt-glass-modal">
      <div class="lt-modal-head">
        <h3 id="authModalTitle">Вход в Lingvo Trainer</h3>
        <button type="button" class="lt-close-btn" onclick="AuthUI.close()">✕</button>
      </div>

      <div id="authLoginForm">
        <label class="lt-label">Электронная почта (Email)</label>
        <input type="email" id="authEmailInp" class="lt-input" placeholder="name@example.com" />

        <label class="lt-label">Пароль (от 6 символов)</label>
        <div class="lt-pass-row">
          <input type="password" id="authPassInp" class="lt-input" placeholder="••••••" />
          <button type="button" class="lt-icon-btn" onclick="AuthUI.togglePassVis()">👁</button>
        </div>

        <div id="authErrorBox" class="lt-form-msg"></div>

        <div class="lt-btn-row">
          <button type="button" class="lt-btn-primary" onclick="CloudAuth.signIn()">Войти</button>
          <button type="button" class="lt-btn-secondary" onclick="CloudAuth.signUp()">Регистрация</button>
        </div>

        <div style="text-align:right; margin-top:10px;">
          <button type="button" class="lt-link-btn" onclick="AuthUI.showReset()">Забыли пароль?</button>
        </div>
      </div>

      <div id="authResetForm" style="display:none;">
        <p class="lt-muted-text">Укажите ваш Email — мы отправим официальную ссылку для сброса пароля.</p>
        <input type="email" id="resetEmailInp" class="lt-input" placeholder="name@example.com" />
        <div id="resetMsgBox" class="lt-form-msg"></div>
        <div class="lt-btn-row">
          <button type="button" class="lt-btn-primary" onclick="CloudAuth.resetPassword()">Отправить письмо</button>
          <button type="button" class="lt-btn-secondary" onclick="AuthUI.showLogin()">Назад ко входу</button>
        </div>
      </div>
    </div>
  </div>

  <!-- МОДУЛИ ИНТЕРФЕЙСА -->
  <script src="ui.js?v=5"></script>
  <script src="router.js?v=4"></script>
  <script src="home.page.js?v=5"></script>
  <script src="rating.page.js?v=4"></script>
  <script src="support.page.js?v=4"></script>

  <!-- ОБЛАЧНОЕ ЯДРО FIREBASE (ES MODULE) -->
    <script src="firebase.js?v=8"></script>
    <script src="profile.page.js?v=2"></script>
</body>
</html>
